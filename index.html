<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather-app</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="search-box">
            <div class="input">
                <input type="text" placeholder="search city" class="inp">
            </div>
            <button class="fa-solid fa-magnifying-glass" id="searchbtn"></button>
        </div>
        <div class="weather-body">
            <img src="assets/fog.png" alt="weather img" id="img">
            <div class="weather-details">
                <h2 id="cityname"></h3>
                <p class="temprature">25 <sup>°C</sup></p>
                <p class="description">Light rain</p>
            </div>

            <div class="weather-box">
                <div class="humidity">
                    <i class="fa-solid fa-droplet"></i>
                    <div class="text">
                        <span id="humidity">45%</span>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="wind">
                    <i class="fa-solid fa-wind"></i>
                    <div class="text">
                        <span id="wind-speed">10Km/h</span>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
